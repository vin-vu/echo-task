spring.application.name=echotaskspring.output.ansi.enabled=ALWAYSspring.profiles.active=devspring.datasource.url=${SPRING_DATASOURCE_URL}spring.datasource.username=${SPRING_DATASOURCE_USERNAME}spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}spring.jpa.hibernate.ddl-auto=updatespring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialectapp.data-dir=${APP_DATA_DIR}# --- DOCCAT ---app.doccat.model-path=${app.data-dir}/doccat/models/en-doccat-v4.binapp.doccat.training-processed-path=${app.data-dir}/doccat/data/doccat-training-processed.txtapp.doccat.training-raw-path=doccat/data/doccat-training-v4.txt# --- NER (Task Finder) ---app.taskfinder.model-path=${app.data-dir}/taskfinder/models/task-ner.binapp.taskfinder.training-processed-path=${app.data-dir}/taskfinder/data/task-ner-training-processed.txtapp.taskfinder.training-raw-path=${app.data-dir}/taskfinder/data/task-ner-training.txt# --- TRAIN FLAGS ---app.trainDoccatModel=falseapp.trainTaskFinderModel=false