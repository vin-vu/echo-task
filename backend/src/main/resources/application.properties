spring.application.name=echotaskspring.output.ansi.enabled=ALWAYSspring.profiles.active=devspring.datasource.url=${SPRING_DATASOURCE_URL}spring.datasource.username=${SPRING_DATASOURCE_USERNAME}spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}spring.jpa.hibernate.ddl-auto=updatespring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialectapp.trainModelOnStartup=falseapp.data-dir=${APP_DATA_DIR}app.model-path=${app.data-dir}/trained-models/en-doccat-v4.binapp.training-processed-path=${app.data-dir}/data/doccat-training-processed.txtapp.training-raw-path=data/doccat-training-v4.txt